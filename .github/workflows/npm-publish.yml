name: Publish release

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Get and validate version number
        id: get-version
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          ./tasks/validate-version.sh "$VERSION"
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}

  lint-test:
    runs-on: ubuntu-latest
    needs:
      - version-check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Check formatting
        run: npm run prettier:check
      
  publish-npm:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@nationalarchives/frontend
    needs:
      - version-check
      - lint-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          scope: '@nationalarchives'
      - name: Install dependencies
        run: npm ci
      - name: Publish to npm
        run: npm publish

  notify-slack:
    runs-on: ubuntu-latest
    needs:
      - version-check
      - publish-npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Get the release notes
        id: release-notes
        run: |
          {
            echo 'RELEASE_NOTES<<EOF'
            ./tasks/get-release-notes.sh ${NEEDS_VERSION_CHECK_OUTPUTS_VERSION}
            echo EOF
          } >> "$GITHUB_OUTPUT"
        env:
          NEEDS_VERSION_CHECK_OUTPUTS_VERSION: ${{ needs.version-check.outputs.version }}
      - uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_TITLE: "`v${{ needs.version-check.outputs.version }}` of `tna-frontend-cookies` has just been published"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_ICON: "https://raw.githubusercontent.com/nationalarchives/tna-frontend-cookies/main/src/nationalarchives/assets/images/icon-1024x1024.png"
          MSG_MINIMAL: true
          SLACKIFY_MARKDOWN: true
          SLACK_MESSAGE: ${{ steps.release-notes.outputs.RELEASE_NOTES }}